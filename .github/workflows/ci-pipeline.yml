
name: Iris Model CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[gdrive] # Or dvc[s3], dvc[azure], dvc[gcs] depending on your remote storage

      - name: Authenticate and Pull DVC data
        # IMPORTANT: You must configure DVC credentials as secrets in your GitHub repo settings
        # For Google Drive, you'd set up GOOGLE_DRIVE_CREDENTIALS_DATA
        # This step assumes you have your dvc remote configured.
        run: |
          dvc pull
        env:
          # Example for Google Drive. Adjust for your DVC remote.
          GOOGLE_DRIVE_CREDENTIALS_DATA: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_DATA }}

      - name: Run Unit Tests
        run: |
          python -m unittest test_iris_model.py > test_output.txt 2>&1

      - name: Setup CML
        uses: iterative/setup-cml@v1

      - name: Create CML Report
        env:
          # Your repo token is automatically provided by GitHub Actions
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Concatenate test output and metrics into the report
          echo "## 🧪 Unit Test Results" > report.md
          cat test_output.txt >> report.md

          echo "\n\n## 📊 Model Metrics" >> report.md
          cat metrics.csv >> report.md

          # Post the report as a comment on the pull request or commit
          cml comment create report.md
